services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:6644:6644"
    env_file:
      - ./api/.env
    container_name: hcgateway_api
    restart: always
    depends_on:
      - db

  db:
    image: mongo:8
    restart: always
    volumes:
      - mongo_data:/data/db
    container_name: hcgateway_db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-hcgateway}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-changeme}

volumes:
  mongo_data:
